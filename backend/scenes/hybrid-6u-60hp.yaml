# The user's own hybrid: 2 x 3U of Eurorack rows, 60 HP wide, with a 300 mm
# parts section below the rack.
#
# The rack is a laser-cut frame lying flat; its 60 HP rail span is the width
# of the whole case, and the case's two ends across it are the side panels.
# The deck top is the panel plane: the faces of the modules screwed in later
# and the flat surface the parts below are flush with.
#
# The section holds 4 x 8 buttons (two NeoTrellis with their elastomer pads),
# four push encoders and a small OLED, each set flush with the deck.

name: hybrid-6u-60hp
kind: hybrid

panels:
- name: main
  z: 0.0
  note: "The deck top: the module faces and the parts' flush surface."

rack:
  hp: 60
  rows:
  - {format: 3U}
  - {format: 3U}
  module_depth: 40.0
  module_panel_t: 2.0
  joint: tslot
  material: {name: plywood-5mm, thickness: 5.0, kerf: 0.15, color: "#c8a165"}
  panel:
    top: 10.5
    bottom: 10.5
    front: 0.0
    back: 0.0
    r_bottom_front: 8.0
    r_top_front: 8.0

sections:
- {id: below1, side: below, length: 300.0, depth: 40.0}

placements:
- id: trellis_a
  part: adafruit-3954-neotrellis
  pos: [30.0, -230.0, 0.0]
  on_panel: main
  panel_ref: buttons
  support: from_lid
- id: pad_a
  part: adafruit-1611-keypad
  parent: trellis_a
  parent_mate: keypad
  mate: pcb
- id: trellis_b
  part: adafruit-3954-neotrellis
  pos: [90.0, -230.0, 0.0]
  on_panel: main
  panel_ref: buttons
  support: from_lid
- id: pad_b
  part: adafruit-1611-keypad
  parent: trellis_b
  parent_mate: keypad
  mate: pcb
- id: encoders
  part: adafruit-5752-quad-encoder
  pos: [200.0, -100.0, 0.0]
  on_panel: main
  panel_ref: bushings
  support: from_lid
- id: oled
  part: adafruit-4741-oled-1v5
  pos: [60.0, -90.0, 0.0]
  on_panel: main
  panel_ref: active_area
  support: from_floor        # its board sits inside the 5 mm deck

case:
  part_clearance: 0.6
  cable_clearance: 5.0
  plates:
  - [800.0, 450.0]
