# The M10 plan's acceptance case: an 84 HP, 3U Eurorack bay beside a
# Raspberry Pi with its HyperPixel touchscreen, in one laser-cut box.
#
# The screen fixes the case's upper surface (the panel plane is its glass);
# the bay's module faces are flush with it (D-3), so the rails sit a module
# panel's thickness -- 2 mm -- under the deck top, and the floor sits the
# bay's 40 mm module depth behind the rails' front face.
#
# The bay is 84 HP of rails waiting for modules: whatever is bought later
# is screwed in there, and no placement may enter its space.

name: hybrid-84hp-pi-hyperpixel

panels:
- name: main
  from_ref: screen.active_area
  note: "The screen's glass, and so the module faces too."

racks:
- id: bay
  at: [0.0, 0.0]
  hp: 84
  rows:
  - {format: 3U}
  module_depth: 40.0
  module_panel_t: 2.0

placements:
- id: pi
  part: rpi-3b
  label: Raspberry Pi 3B
  pos: [447.0, 66.0, 0.0]
  mount: manual
  support: from_floor
- id: screen
  part: hyperpixel4-square-touch
  label: HyperPixel 4.0 Square
  parent: pi
  parent_mate: gpio40
  mate: gpio40
  mate_gap: 17.0

case:
  style: box
  box_joint: tslot
  materials:
  - {name: plywood-3mm, thickness: 3.0, kerf: 0.15, color: "#c8a165"}
  wall: 8.0
  floor_gap: 4.0
  ceiling_gap: 1.0
  part_clearance: 0.6
  cable_clearance: 5.0
  plates:
  - [600.0, 400.0]
