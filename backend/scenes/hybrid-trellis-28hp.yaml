# A small hybrid: one 3U row of 28 HP, with 4 x 8 buttons below it.
#
# The rack is a laser-cut Eurorack frame lying flat; its 28 HP rail span is
# the width of the whole case. Below it, a 90 mm parts section holds two
# NeoTrellis boards side by side, each with its elastomer 4x4 pad: 32
# buttons whose tops are flush with the deck -- and with the faces of the
# modules screwed into the rack later (decision D-3).
#
# 3 mm plywood with captive-nut T-slots; the section's floor is 30 mm under
# the deck, the rack's 40 mm module depth behind the rails' front face.

name: hybrid-trellis-28hp
kind: hybrid

panels:
- name: main
  z: 0.0
  note: "The button tops and the module faces -- the case's upper surface."

rack:
  hp: 28
  rows:
  - {format: 3U}
  module_depth: 40.0
  module_panel_t: 2.0
  joint: tslot
  material: {name: plywood-3mm, thickness: 3.0, kerf: 0.15, color: "#c8a165"}

sections:
- {id: buttons, side: below, length: 90.0, depth: 30.0}

placements:
- id: trellis_a
  part: adafruit-3954-neotrellis
  pos: [11.0, -78.0, 0.0]
  on_panel: main
  panel_ref: buttons         # the pad's button tops, not the PCB's
  support: from_lid
- id: pad_a
  part: adafruit-1611-keypad
  parent: trellis_a
  parent_mate: keypad
  mate: pcb
- id: trellis_b
  part: adafruit-3954-neotrellis
  pos: [71.0, -78.0, 0.0]    # 60 mm on: the button pitch runs on across the seam
  on_panel: main
  panel_ref: buttons
  support: from_lid
- id: pad_b
  part: adafruit-1611-keypad
  parent: trellis_b
  parent_mate: keypad
  mate: pcb

case:
  part_clearance: 0.6
  plates:
  - [600.0, 400.0]
