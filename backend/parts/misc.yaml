parts:
  - id: shorepine-amyboard
    name: AMYboard (ESP32-S3 synth, 10 HP Eurorack)
    vendor: Shorepine / Makerfabs
    url: https://www.amyboard.com/
    category: synth
    tags: [esp32s3, eurorack, midi, cv, spdif, patchbay, i2c]
    cad: ../img/amyboard_front_panel_annotated.jpg
    notes: >-
      Modelled BOARD-first, like every other part: origin at the PCB's
      bottom-left, z = 0 at the PCB bottom face, +Z out of the jack side.
      (It used to be modelled panel-first, which put a full-size 50.5 x 128.5
      slab 11 mm above the board with nothing under most of it -- a plane
      apparently hovering in mid air. The acrylic panel is a separate object
      that happens to ship in the same box, so it is now a separate part:
      shorepine-amyboard-panel, mated on at the jack plane.)
      The jacks are panel-mount: their bodies stand ~11 mm off the PCB and the
      threaded bushings pass through whatever panel you use -- theirs, or the
      faceplate of this case. Ten of them in TWO COLUMNS OF FIVE hard against
      the +X edge, rows SPDIF / LINE / MIDI / CV1 / CV2 top to bottom, left
      column IN and right column OUT.
      Dimensions come from the vendor's own files: amyboard-v1.5.brd (Eagle,
      board outline, every connector position) and amyboard_front_panel.dxf
      (jack drill size, display window) at tulipcc/docs/pcbs/amyboard. The
      first faceplate was cut from photo-scaled estimates and the jacks did
      not line up: the real pitch is 11.0 mm along the board and 9.7 mm
      between the IN and OUT columns, not 12 x 12.
      Frame mapping: our x = the board's short axis (48 mm, Eagle y), our
      y = its long axis (106 mm, Eagle x), +z = the jack side. The board has
      NO mounting holes -- it hangs from its ten jack bushings clamped to
      the panel, which is how Eurorack modules mount.
    src:
      confidence: datasheet
      url: https://github.com/shorepine/tulipcc/tree/main/docs/pcbs/amyboard

    outline:
      type: rect
      size: [48.0, 106.0]           # amyboard-v1.5.brd Dimension layer
      corner_radius: 0.5
      origin: min
    pcb_thickness: 1.6

    # NO mounting holes. The v1.5 Eagle board has no drill of 2 mm or more
    # anywhere -- the four "corner holes" a photo once suggested were vias
    # and silk. The module hangs from its ten jack bushings clamped to the
    # faceplate, exactly like any other Eurorack module.

    volumes:
      - name: back_components
        kind: body
        at: [24.0, 53.0]
        size: [48.0, 106.0]
        z: [-11.4, 0.0]
        src: {confidence: estimated, note: "power header and Tulip port are the tall ones; height still a photo estimate"}
      # Ten NV-PJ3410 panel jacks, 2 columns x 5 rows. From the v1.5 board:
      # columns at x 33.0 (IN) and 42.7 (OUT), rows at y 9.5 .. 53.5 on an
      # 11.0 mm pitch. Grid centre (37.85, 31.5).
      - name: jack_bodies
        kind: body
        at: [37.85, 31.5]
        size: [9.4, 9.4]
        z: [1.6, 12.6]
        repeat: {count: [2, 5], pitch: [9.7, 11.0]}
        src: {confidence: datasheet, note: "positions from amyboard-v1.5.brd; body height sets how far the panel stands off"}
      - name: jack_threads
        kind: actuator
        at: [37.85, 31.5]
        size: [7.0, 7.0]
        z: [12.6, 17.0]
        shape: circle
        repeat: {count: [2, 5], pitch: [9.7, 11.0]}
        src:
          confidence: estimated
          note: >-
            The threaded bushing that goes through the panel, and the nut that
            holds it. This is what a faceplate needs a round hole for -- ten of
            them, not one slot.
      - name: display_space
        kind: keepout
        at: [24.0, 85.5]
        size: [44.0, 41.0]
        z: [1.6, 12.6]
        src:
          confidence: estimated
          note: >-
            The vendor calls this "front panel free space for display" -- the
            top ~34 mm of the board carries nothing, and is big enough for our
            own OLED behind the same faceplate.

    connectors:
      # mouths sit at the panel plane, z = 12.6
      # Positions from amyboard-v1.5.brd; the 7.7 mm hole is the drill the
      # vendor's own acrylic panel uses for these bushings (M7 thread).
      - {name: spdif_in,  type: jack_3v5, face: +z, at: [33.0, 53.5, 12.6], plug_depth: 22.0, bend_radius: 25.0, cutout: [7.7, 7.7], cutout_shape: circle, external: true, src: {confidence: datasheet}}
      - {name: spdif_out, type: jack_3v5, face: +z, at: [42.7, 53.5, 12.6], plug_depth: 22.0, bend_radius: 25.0, cutout: [7.7, 7.7], cutout_shape: circle, external: true, src: {confidence: datasheet}}
      - {name: line_in,   type: jack_3v5, face: +z, at: [33.0, 42.5, 12.6], plug_depth: 22.0, bend_radius: 25.0, cutout: [7.7, 7.7], cutout_shape: circle, external: true, src: {confidence: datasheet}}
      - {name: line_out,  type: jack_3v5, face: +z, at: [42.7, 42.5, 12.6], plug_depth: 22.0, bend_radius: 25.0, cutout: [7.7, 7.7], cutout_shape: circle, external: true, src: {confidence: datasheet}}
      - {name: midi_in,   type: jack_3v5, face: +z, at: [33.0, 31.5, 12.6], plug_depth: 22.0, bend_radius: 25.0, cutout: [7.7, 7.7], cutout_shape: circle, external: true, src: {confidence: datasheet}}
      - {name: midi_out,  type: jack_3v5, face: +z, at: [42.7, 31.5, 12.6], plug_depth: 22.0, bend_radius: 25.0, cutout: [7.7, 7.7], cutout_shape: circle, external: true, src: {confidence: datasheet}}
      - {name: cv1_in,    type: jack_3v5, face: +z, at: [33.0, 20.5, 12.6], plug_depth: 22.0, bend_radius: 25.0, cutout: [7.7, 7.7], cutout_shape: circle, external: true, src: {confidence: datasheet}}
      - {name: cv1_out,   type: jack_3v5, face: +z, at: [42.7, 20.5, 12.6], plug_depth: 22.0, bend_radius: 25.0, cutout: [7.7, 7.7], cutout_shape: circle, external: true, src: {confidence: datasheet}}
      - {name: cv2_in,    type: jack_3v5, face: +z, at: [33.0, 9.5, 12.6], plug_depth: 22.0, bend_radius: 25.0, cutout: [7.7, 7.7], cutout_shape: circle, external: true, src: {confidence: datasheet}}
      - {name: cv2_out,   type: jack_3v5, face: +z, at: [42.7, 9.5, 12.6], plug_depth: 22.0, bend_radius: 25.0, cutout: [7.7, 7.7], cutout_shape: circle, external: true, src: {confidence: datasheet}}

      - name: i2c_accessories
        type: grove
        face: -y
        at: [10.3, 0.0, 4.0]
        plug_depth: 10.0
        bend_radius: 14.0
        cutout: [14.0, 8.0]
        # Faces the front, but the lead it takes runs to another board inside
        # this case -- it is not a port anyone plugs into from outside, so it
        # must not punch a hole through the faceplate.
        external: false
        src: {confidence: datasheet, note: "silk I2C_HOST: side-entry JST-PH on the jack side, cable leaves the bottom edge (v1.5 brd)"}
      - name: usb_c
        type: usb_c
        face: +x
        at: [48.0, 66.95, -1.6]
        plug_depth: 18.0
        bend_radius: 20.0
        cutout: [12.0, 8.0]
        external: true
        src: {confidence: estimated}
      - name: microsd
        type: microsd
        face: +y
        at: [34.8, 106.0, -1.5]
        plug_depth: 16.0
        bend_radius: 0.0
        cutout: [16.0, 4.0]
        external: true
        src: {confidence: estimated}
      - name: i2c_tulip_host
        type: grove
        face: +x
        at: [48.0, 79.1, -2.0]
        plug_depth: 12.0
        bend_radius: 15.0
        external: false
        src: {confidence: datasheet, note: "silk I2C_CONTROL: side-entry JST-PH on the back, cable leaves the +x edge (v1.5 brd)"}
      - name: debug_serial
        type: header_1x6
        face: -z
        at: [13.7, 76.0, -11.4]
        plug_depth: 10.0
        external: false
        src: {confidence: estimated}

    mates:
      - name: panel
        standard: amyboard_panel
        role: socket
        at: [37.85, 31.5, 12.6]
        face: +z
        src: {confidence: datasheet, note: "jack grid centre from the v1.5 board; the plane the bushings clamp"}
      - name: eurorack_power
        standard: eurorack_power_10
        role: socket
        at: [5.8, 63.9, -11.4]
        face: -z
        src: {confidence: datasheet, note: "10-pin shrouded IDC, position from the v1.5 board"}

  - id: shorepine-amyboard-panel
    name: AMYboard acrylic front panel (10 HP)
    vendor: Shorepine / Makerfabs
    url: https://github.com/shorepine/tulipcc/blob/main/docs/modular.md
    category: panel
    tags: [eurorack, acrylic, accessory]
    notes: >-
      The unlabelled acrylic panel that ships with an AMYboard, as its own part
      -- mate it onto the board's `panel` mate if you want to keep it, or leave
      it out and let this case's own faceplate carry the jacks. That choice
      changes the front of the machine, so it should be a placement you can see
      and delete rather than something welded into the board model.
      Panel size is a standard: 10 HP = 10*5.08 - 0.3 = 50.5 mm, 3U = 128.5 mm,
      rail holes 123.5 mm apart. The board sits 11.75 mm up from the panel's
      bottom edge, which is where the mate lands.
    src:
      confidence: datasheet
      url: https://doepfer.de/a100_man/a100m_e.htm

    outline:
      type: rect
      size: [50.5, 128.5]
      corner_radius: 1.0
      origin: min
    pcb_thickness: 2.0

    holes:
      - {name: rail_bl, at: [3.5, 3.0], diameter: 3.2, screw: M3, src: {confidence: datasheet, note: "Doepfer A-100, 123.5 mm apart"}}
      - {name: rail_tl, at: [3.5, 126.5], diameter: 3.2, screw: M3, src: {confidence: datasheet}}
      - {name: rail_br, at: [47.0, 3.0], diameter: 3.2, screw: M3, src: {confidence: datasheet}}
      - {name: rail_tr, at: [47.0, 126.5], diameter: 3.2, screw: M3, src: {confidence: datasheet}}

    volumes:
      - name: face
        kind: display
        at: [25.25, 64.25]
        size: [50.5, 128.5]
        z: [0.0, 2.0]
        src: {confidence: datasheet, note: "the labelled face; keep it reachable"}

    mates:
      - name: board
        standard: amyboard_panel
        role: plug
        at: [39.0, 42.85, 0.0]
        face: -z
        src: {confidence: datasheet, note: "jack grid centre from amyboard_front_panel.dxf"}

  - id: seeed-grove-tca9548a
    name: Grove - 8 Channel I2C Multiplexer / I2C Hub (TCA9548A)
    vendor: Seeed Studio
    sku: "103020293"
    url: https://wiki.seeedstudio.com/Grove-8-Channel-I2C-Multiplexer-I2C-Hub-TCA9548A/
    category: interconnect
    tags: [i2c, grove, mux]
    cad: ../datasheets/grove-tca9548a.pdf
    notes: >-
      NOT a 40 x 40 double-Grove square, which is what we had: it is a long
      narrow strip, about 90 x 20 mm, with the eight channel ports in a single
      row along one long edge and the upstream port on the short end.
      Seeed publishes no mechanical drawing and no dimensions anywhere -- the
      wiki, the shop page and the DigiKey datasheet all omit them -- so these
      numbers are scaled off the board photos in the DigiKey datasheet
      (vendor/datasheets/grove-tca9548a.pdf) using the 11.9 mm Grove connector
      body as the ruler. The SHAPE is right; the millimetres are estimates and
      the port pitch is the weakest of them. MEASURE ME -- you own this board.
      Layout, left to right: upstream I2C port on the -X end (silkscreen
      "0x70 I2C"), then the TCA9548A and its address jumpers, then I2C0..I2C7
      along the +Y edge. All nine cables leave towards +Y or -X, which is what
      makes this board's clearance matter more than its footprint.
    src:
      confidence: estimated
      url: https://media.digikey.com/pdf/Data%20Sheets/Seeed%20Technology/103020293_Web.pdf

    outline:
      type: rect
      size: [90.0, 20.0]
      corner_radius: 2.0
      origin: min
    pcb_thickness: 1.6

    holes:
      - {name: h1, at: [4.0, 10.0], diameter: 2.0, screw: M2, src: {confidence: estimated}}
      - {name: h2, at: [45.0, 17.0], diameter: 2.0, screw: M2, src: {confidence: estimated}}
      - {name: h3, at: [45.0, 3.0], diameter: 2.0, screw: M2, src: {confidence: estimated}}
      - {name: h4, at: [86.0, 10.0], diameter: 2.0, screw: M2, src: {confidence: estimated}}

    volumes:
      - name: grove_sockets
        kind: body
        at: [58.0, 13.0]
        size: [64.0, 12.0]
        z: [1.6, 7.2]
        src: {confidence: estimated, note: "the row of eight, 5.6 mm tall"}
      - name: input_and_mux
        kind: body
        at: [13.0, 10.0]
        size: [26.0, 18.0]
        z: [1.6, 7.2]
        src: {confidence: estimated, note: "upstream port, TCA9548A, address jumpers"}
      - name: underside
        kind: body
        at: [45.0, 10.0]
        size: [90.0, 20.0]
        z: [-2.0, 0.0]
        src: {confidence: estimated}

    connectors:
      - {name: up, type: grove, face: -x, at: [0.0, 10.0, 1.6], plug_depth: 12.0, bend_radius: 15.0, external: false, src: {confidence: estimated, note: "silkscreen 0x70 I2C"}}
      - {name: i2c0, type: grove, face: +y, at: [29.0, 20.0, 1.6], plug_depth: 12.0, bend_radius: 15.0, external: false, src: {confidence: estimated}}
      - {name: i2c1, type: grove, face: +y, at: [37.6, 20.0, 1.6], plug_depth: 12.0, bend_radius: 15.0, external: false, src: {confidence: estimated}}
      - {name: i2c2, type: grove, face: +y, at: [46.2, 20.0, 1.6], plug_depth: 12.0, bend_radius: 15.0, external: false, src: {confidence: estimated}}
      - {name: i2c3, type: grove, face: +y, at: [54.8, 20.0, 1.6], plug_depth: 12.0, bend_radius: 15.0, external: false, src: {confidence: estimated}}
      - {name: i2c4, type: grove, face: +y, at: [63.4, 20.0, 1.6], plug_depth: 12.0, bend_radius: 15.0, external: false, src: {confidence: estimated}}
      - {name: i2c5, type: grove, face: +y, at: [72.0, 20.0, 1.6], plug_depth: 12.0, bend_radius: 15.0, external: false, src: {confidence: estimated}}
      - {name: i2c6, type: grove, face: +y, at: [80.6, 20.0, 1.6], plug_depth: 12.0, bend_radius: 15.0, external: false, src: {confidence: estimated}}
      - {name: i2c7, type: grove, face: +y, at: [89.2, 20.0, 1.6], plug_depth: 12.0, bend_radius: 15.0, external: false, src: {confidence: estimated}}
