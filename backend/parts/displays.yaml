parts:
  - id: hyperpixel4-square-touch
    name: Pimoroni HyperPixel 4.0 Square Touch
    vendor: Pimoroni
    sku: PIM470
    url: https://shop.pimoroni.com/products/hyperpixel-4-square
    category: display
    tags: [dpi, touch, hat, gpio40]
    notes: >-
      MEASURE ME FIRST. The overall 84 x 84 x 9.5 mm envelope and the 72 x 72 mm
      active area are vendor-published, but the XY position of the 40-way socket
      on the board is our estimate (assumed centred in X, 4.0 mm in from the
      header edge). That single number decides how far this board overhangs the
      Pi, i.e. how much room the HDMI and power plugs get. Verify it before
      cutting anything.
      Depth note: 9.5 mm "includes header and display", so the bare board plus
      glass is ~7 mm and the socket hangs below.
      The bundled 40-pin extension header raises the board so it clears the Pi's
      16 mm tall USB/Ethernet stack -- model that with placement.mate_gap
      (8.5 mm plain socket, ~17.0 mm with the booster).
    src:
      confidence: vendor
      url: https://shop.pimoroni.com/products/hyperpixel-4-square

    outline:
      type: rect
      size: [84.0, 84.0]
      corner_radius: 3.0
      origin: min
    pcb_thickness: 1.6

    volumes:
      - name: lcd_module
        kind: body
        at: [42.0, 42.0]
        size: [84.0, 84.0]
        z: [1.6, 7.0]
        src: {confidence: vendor, note: "glass + backlight stack on top of the PCB"}
      # NOT centred on the board. The vendor quotes bezels of 5.5 mm left and
      # right but 4.5 top and 6.5 bottom, so the lit area sits 1 mm towards the
      # header edge: centre y = (6.5 + (84 - 4.5)) / 2 = 43.0, against a board
      # centre of 42.0. That 1 mm is the difference between a window that frames
      # the picture and one that clips it.
      # The quoted bezels sum to 83, not 84, on both axes -- so there is 1 mm
      # unaccounted for and the offset is good to about half a millimetre.
      - name: active_area
        kind: display
        at: [42.0, 43.0]
        size: [72.0, 72.0]
        z: [6.0, 7.0]
        src:
          confidence: vendor
          note: >-
            72x72 active, offset +1.0 mm in Y from the board centre because the
            top and bottom bezels differ (4.5 vs 6.5).
      - name: gpio_socket
        kind: body
        at: [42.0, 80.0]
        size: [52.0, 6.0]
        z: [-8.5, 1.6]
        src: {confidence: estimated, note: "female 2x20; XY position is the key unknown"}
      - name: touch_flex
        kind: keepout
        at: [42.0, 6.0]
        size: [30.0, 10.0]
        z: [-3.0, 1.6]
        src: {confidence: estimated, note: "display flex loops under the board"}

    mates:
      - name: gpio40
        standard: rpi_gpio_40
        role: plug
        at: [42.0, 80.0, 0.0]
        face: -z
        rotations: [0.0]
        src: {confidence: estimated}

  - id: adafruit-4741-oled-1v5
    name: Adafruit Grayscale 1.5" 128x128 OLED (SSD1327)
    vendor: Adafruit
    sku: "4741"
    url: https://www.adafruit.com/product/4741
    category: display
    tags: [oled, i2c, stemma_qt, spi]
    cad: adafruit/4741/4741 1.5-inch OLED.stl
    notes: >-
      Measured by splitting the vendor mesh into connected bodies rather than
      by slicing it into bands -- band slicing merged the two STEMMA QT
      connectors on opposite edges into one imaginary "strip across the
      display", and a display was then fitted to that fiction.
      The model is built display-DOWN, so it is flipped here (mirrored in z
      and in x, because mirroring one axis alone would put every connector on
      the wrong side). Board 35.56 x 46.99 x 1.57, display module 33.80 x
      36.50 x 1.10 on top of it, two QT connectors and the SMD components
      underneath. Not square: 1.4" x 1.85".
    src:
      confidence: datasheet
      url: https://github.com/adafruit/Adafruit_CAD_Parts

    outline:
      type: rect
      size: [35.56, 46.99]
      corner_radius: 2.0
      origin: min
    pcb_thickness: 1.6

    # Four M2 clearance holes on a 30.48 x 41.91 mm pattern (1.2" x 1.65"),
    # from the vendor STEP.
    holes:
      - {name: h1, at: [2.54, 2.54], diameter: 2.5, screw: M2, src: {confidence: datasheet, note: "from the vendor STEP"}}
      - {name: h2, at: [2.54, 44.45], diameter: 2.5, screw: M2, src: {confidence: datasheet, note: "from the vendor STEP"}}
      - {name: h3, at: [33.02, 2.54], diameter: 2.5, screw: M2, src: {confidence: datasheet, note: "from the vendor STEP"}}
      - {name: h4, at: [33.02, 44.45], diameter: 2.5, screw: M2, src: {confidence: datasheet, note: "from the vendor STEP"}}

    volumes:
      - name: display_module
        kind: body
        at: [17.65, 23.75]
        size: [33.80, 36.50]
        z: [1.57, 2.67]
        src: {confidence: datasheet, note: "body 2 of 4741 1.5-inch OLED.stl"}
      # 1.5 inch on a 128x128 square panel is a 26.9 mm side, and unlike the
      # last attempt it fits: the module is 33.8 x 36.5. Where exactly it sits
      # inside that module is the guess -- centred is the sane default, and
      # the bezel is generous enough that being a millimetre out is survivable.
      # Deliberately larger than the 26.9 mm lit panel: the owner sized the
      # window off the real board for off-axis viewing, so the faceplate
      # does not block the eye when looking from the side. Full board width;
      # vertically 3.5 mm clear of the upper screw centres (y 44.45) and
      # 4.96 mm clear of the lower ones (y 2.54). Not a physical feature:
      # this is the cut region the faceplate opens, so it may cross the
      # module box (wider in x, shorter in y).
      - name: active_area
        kind: display
        at: [17.78, 24.225]
        size: [35.56, 33.45]
        z: [2.57, 2.67]
        src:
          confidence: measured
          note: >-
            Viewing window sized by eye on the real board, not the lit area:
            full board width, y 7.50..40.95. The lit 128x128 panel itself is
            26.9 mm square, centred in the 33.8 x 36.5 module, and must stay
            inside this window.
      # Underneath: the QT connectors stand furthest proud, so they set how
      # much room the board needs below the PCB.
      - name: qt_left_body
        kind: body
        at: [2.93, 23.51]
        size: [4.95, 6.00]
        z: [-2.96, 0.0]
        src: {confidence: datasheet, note: "body 4 of 4741 1.5-inch OLED.stl"}
      - name: qt_right_body
        kind: body
        at: [32.63, 23.48]
        size: [4.95, 6.00]
        z: [-2.96, 0.0]
        src: {confidence: datasheet, note: "body 3 of 4741 1.5-inch OLED.stl"}
      - name: components
        kind: keepout
        at: [17.78, 23.49]
        size: [35.56, 46.99]
        z: [-2.0, 0.0]
        src:
          confidence: datasheet
          note: >-
            225 small bodies on the underside, tallest 2.0 mm. Not worth 225
            volumes; one keepout says the same thing to a case.

    connectors:
      # Measured: both sit mid-board, on the underside, facing outward.
      - name: qt_left
        type: stemma_qt
        face: -x
        at: [0.0, 23.51, -1.5]
        plug_depth: 6.0
        bend_radius: 10.0
        external: false
        src: {confidence: datasheet, note: "body 4 of the vendor mesh"}
      - name: qt_right
        type: stemma_qt
        face: +x
        at: [35.56, 23.48, -1.5]
        plug_depth: 6.0
        bend_radius: 10.0
        external: false
        src: {confidence: datasheet, note: "body 3 of the vendor mesh"}
